name: Saga UI build and parity

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.gitattributes'
      - 'vite.saga-ui.config.mjs'
      - 'manifest.json'
      - 'src/**'
      - 'styles/**'
      - 'assets/**'
      - 'content/loredecks/**'
      - 'tests/browser/**'
      - 'tests/fixtures/**'
      - 'tools/**'
      - '.github/workflows/saga-ui-check.yml'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.gitattributes'
      - 'vite.saga-ui.config.mjs'
      - 'manifest.json'
      - 'src/**'
      - 'styles/**'
      - 'assets/**'
      - 'content/loredecks/**'
      - 'tests/browser/**'
      - 'tests/fixtures/**'
      - 'tools/**'
      - '.github/workflows/saga-ui-check.yml'

permissions:
  contents: read

jobs:
  generated-and-node:
    name: Node and generated bytes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
      - name: Install pinned development dependencies (includes native Sharp)
        run: npm ci
      - name: Rebuild UI and thumbnails independently; compare complete sets and bytes
        run: npm run check:generated
      - name: Run fast Node regression and alpha suites
        run: node tools/scripts/run-alpha-gate.mjs
      - name: Run full deterministic adversarial acceptance tooling suite
        run: node tools/scripts/test-rendering-performance-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: node-generated-failure-${{ matrix.os }}
          path: |
            .tmp/saga-*/**
            test-results/**
            playwright-report/**
          if-no-files-found: ignore

  browser-parity:
    name: Playwright ${{ matrix.engine }} on Linux (engine/emulation coverage)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci
      - name: Check generated prerequisites
        run: npm run check:generated
      - name: Install pinned Playwright engine and Linux libraries
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Require the observed original draft-presentation reference
        run: node --input-type=module -e "import { access, mkdir } from 'node:fs/promises'; await access('tests/browser/workbench-draft-presentation-reference.json'); await mkdir('.tmp/saga-ui-ci', {recursive:true});"
      - name: Run complete final workbench parity
        env:
          SAGA_PARITY_BROWSER: ${{ matrix.engine }}
          SAGA_PARITY_REPORT: .tmp/saga-ui-ci/${{ matrix.engine }}-provenance.json
          SAGA_PARITY_ARTIFACT_DIR: .tmp/saga-ui-ci/${{ matrix.engine }}-artifacts
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap --test-reporter-destination=.tmp/saga-ui-ci/${{ matrix.engine }}-parity.tap tools/scripts/test-loredeck-workbench-browser-parity.mjs
      - name: Chromium adapter and generated freshness adversaries
        if: matrix.engine == 'chromium'
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap --test-reporter-destination=.tmp/saga-ui-ci/chromium-adapter.tap tools/scripts/test-loredeck-workbench-svelte-adapter.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-${{ matrix.engine }}
          include-hidden-files: true
          path: |
            .tmp/saga-ui-ci/${{ matrix.engine }}-parity.tap
            .tmp/saga-ui-ci/${{ matrix.engine }}-provenance.json
            .tmp/saga-ui-ci/chromium-adapter.tap
            .tmp/saga-ui-ci/${{ matrix.engine }}-artifacts/*/failure.json
            .tmp/saga-ui-ci/${{ matrix.engine }}-artifacts/*/failure.png
            .tmp/saga-ui-ci/${{ matrix.engine }}-artifacts/*/trace.zip
          if-no-files-found: ignore
